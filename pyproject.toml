[project]
name = "ttmediabot"
version = "2.3.1"
description = "A media streaming bot for TeamTalk."
authors = [
    { name = "Amir Gumerov", email = "gumerov.amir.e@gmail.com" },
    { name = "Vladislav Kopylov" },
    { name = "Beqa Gozalishvili" },
    { name = "Kirill Belousov" },
]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "babel ~= 2.17.0",
    "beautifulsoup4 ~= 4.13.4",
    "httpx <= 0.26.0",
    "patool ~= 4.0.1",
    "portalocker ~= 3.2.0",
    "pydantic ~= 2.11.7",
    "pyshorteners ~= 1.0.1",
    "requests ~= 2.32.3",
    "vk-api ~= 11.9.9",
    "yandex-music ~= 2.0.1",
    "youtube-search-python ~= 1.6.6",
    "yt-dlp ~= 2025.6.30",
]

[project.urls]
Homepage = "https://github.com/gumerov-amir/TTMediaBot"

[project.optional-dependencies]
dev = [
    "black ~= 24.4.2",
    "flake8 ~= 7.1.0",
    "flake8-black ~= 0.2.1",
    "flake8-bandit ~= 4.1.1",
    "flake8-commas ~= 2.1.0",
    "flake8-eradicate ~= 1.5.0",
    "flake8-quotes ~= 3.4.0",
    "ruff ~= 0.5.2",
]
